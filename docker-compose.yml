name: "partaix-id"
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: nndproject/iwpi.info
    container_name: iwpi-info
    restart: always
    env_file:
      - .env-docker
    ports:
      - "8080:80"
    # Source & vendor sudah ada di dalam image; hanya data yang perlu persisten.
    # public/storage dan public/media adalah symlink ke storage/app/public (dibuat entrypoint).
    volumes:
      - ./storage:/var/www/html/storage
    networks:
      - inet
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  inet:
    driver: bridge
