name: "iwpi-info"
services:
  webserve:
    build:
      context: .
      dockerfile: Dockerfile
    image: nndproject/iwipi.info
    container_name: iwpi.info_main
    restart: always
    env_file:
      - .env-docker
    # Source & vendor sudah ada di dalam image; hanya data yang perlu persisten.
    # public/storage dan public/media adalah symlink ke storage/app/public (dibuat entrypoint).
    volumes:
      - ./storage:/var/www/html/storage
    networks:
        nginx-proxy-network:
            ipv4_address: 10.10.0.2
networks:
    nginx-proxy-network:
        external: true
